<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - Conversor 2.0</title>
    
    <link rel="shortcut icon" href="imgs/favicon-16x16.png" type="image">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-gradient"></div>

    <main class="container converter-container">
        
        <section class="card glass-card shadow-lg mb-4">
            <div class="card-body">
                
                <header class="d-flex justify-content-between align-items-center mb-4">
                    
                    <a href="index.html" class="btn btn-icon-swap btn-back" 
                       aria-label="Voltar para o conversor" title="Voltar">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    
                    <h1 class="h3 fw-bold text-light mb-0 text-center">Histórico</h1>
                    
                    <button type="button" class="btn btn-danger btn-icon-swap" 
                            id="btn-limpar-historico" aria-label="Limpar histórico" title="Limpar Histórico">
                        <i class="bi bi-trash3-fill"></i>
                    </button>
                </header>

                <div id="lista-historico" class="list-group">
                    
                    <p id="historico-vazio" class="text-center text-light-secondary" style="display: none;">
                        Seu histórico de conversões está vazio.
                    </p>

                    </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script src="historico.js"></script>
</body>
</html>
