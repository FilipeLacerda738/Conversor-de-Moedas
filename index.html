<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas 2.0</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-gradient"></div>

    <main class="container converter-container">
        
        <section class="card glass-card shadow-lg mb-4">
            <div class="card-body">
                
                <header class="text-center mb-4">
                    <h1 class="h3 fw-bold">Conversor de Moedas 2.0</h1>
                </header>

                <form id="formulario-conversao" aria-label="Formulário de conversão de moedas">
                    <div class="row g-3 align-items-center">
                        
                        <div class="col-md-12">
                            <label for="valor" class="form-label">Quantia</label>
                            <input type="number" class="form-control form-control-lg" id="valor" value="1" min="0" step="0.01">
                        </div>

                        <div class="col-md-5 col-12">
                            <label for="moeda-de" class="form-label">De</label>
                            <select class="form-select form-select-lg" id="moeda-de" aria-label="Moeda de origem"></select>
                        </div>

                        <div class="col-md-2 col-12 text-center d-flex align-items-end justify-content-center">
                            <button type="button" class="btn btn-icon-swap" id="botao-troca" aria-label="Inverter moedas">
                                <i class="bi bi-arrow-left-right"></i>
                            </button>
                        </div>

                        <div class="col-md-5 col-12">
                            <label for="moeda-para" class="form-label">Para</label>
                            <select class="form-select form-select-lg" id="moeda-para" aria-label="Moeda de destino"></select>
                        </div>
                    </div>
                </form>

                <output id="area-resultado" class="text-center mt-4" aria-live="polite">
                    <div class="loader" id="loader"></div>
                    <p class="texto-resultado-base mb-1" id="texto-resultado">100 BRL =</p>
                    <p class="valor-resultado-final mb-0" id="valor-resultado">515,00 USD</p>
                </output>

            </div>
        </section>

        <section class="card glass-card shadow-lg">
            <div class="card-body">
                <header class="text-center mb-3">
                    <h2 class="h5" id="titulo-grafico">Histórico (Últimos 30 dias)</h2>
                </header>
                <div class="chart-container">
                    <canvas id="grafico-moedas"></canvas>
                </div>
            </div>
        </section>

        <footer class="text-center mt-3">
            <small id="data-atualizacao" class="text-black-50"></small>
        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="script.js"></script>
</body>
</html>
